name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Prepare Workspace & Add Android
        run: |
          npm install
          mkdir -p www
          touch www/index.html
          npx cap add android
          
          # Optional: Agar repo me appicon.png hai to icon banaye
          mkdir -p assets
          if [ -f "appicon.png" ]; then
            cp appicon.png assets/icon.png
            npx @capacitor/assets generate --android
          fi
          
          npx cap sync android

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Rename APK and Upload Artifact
        run: |
          # APK ka naam app-debug.apk se change kar raha hai
          APP_NAME=$(jq -r '.appName' capacitor.config.json | sed 's/ //g')
          mv android/app/build/outputs/apk/debug/app-debug.apk "android/app/build/outputs/apk/debug/${APP_NAME}.apk"
          echo "APK_FILE=${APP_NAME}.apk" >> $GITHUB_ENV
          echo "ZIP_NAME=${APP_NAME}" >> $GITHUB_ENV

      - name: Upload Build
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}
          path: android/app/build/outputs/apk/debug/${{ env.APK_FILE }}
        
