name: Build Trendify APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Repository checkout
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # 3. Java 17
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 4. Install dependencies
      - name: Install Dependencies
        run: npm install

      # 5. Create minimal local web directory
      # APK actual website capacitor.config.json ke
      # server.url se load karega.
      - name: Prepare Web Directory
        run: |
          mkdir -p www
          printf '<!DOCTYPE html><html><body></body></html>' > www/index.html

      # 6. Create Android project only if it does not already exist
      - name: Create Android Project
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      # 7. Sync Capacitor
      - name: Sync Capacitor
        run: npx cap sync android

      # 8. Build Debug APK
      - name: Build Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      # 9. Rename APK
      - name: Prepare APK
        run: |
          mkdir -p output
          cp android/app/build/outputs/apk/debug/app-debug.apk output/Trendify.apk

      # 10. Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Trendify-APK
          path: output/Trendify.apk