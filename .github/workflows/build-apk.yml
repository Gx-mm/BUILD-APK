
name: Build Trendify Release APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"

      - name: Validate configuration
        run: |
          test -f capacitor.config.json
          node -e '
            const c = require("./capacitor.config.json");
            if (c.appName !== "Trendify") throw Error("Wrong appName");
            if (c.server?.url !== "https://trendify.site.je") throw Error("Wrong website URL");
            if (c.appId !== "com.trendify.app") throw Error("Unexpected appId");
          '

      - name: Install dependencies and prepare Android
        run: |
          npm install
          mkdir -p www
          test -f www/index.html || \
            echo '<!doctype html><html><body>Trendify</body></html>' > www/index.html

          npx cap add android

          if [ -f appicon.png ]; then
            mkdir -p assets
            cp appicon.png assets/icon.png
            npx @capacitor/assets generate --android
          fi

          npx cap sync android

      - name: Check signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64"
          test -n "$STORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"

      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode \
            > "$RUNNER_TEMP/trendify-release.jks"
          test -s "$RUNNER_TEMP/trendify-release.jks"

      - name: Build release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Align and sign release APK
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail

          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$SDK"

          BT="$(find "$SDK/build-tools" -mindepth 1 -maxdepth 1 \
            -type d | sort -V | tail -1)"
          test -x "$BT/zipalign"
          test -x "$BT/apksigner"

          APK="$(find android/app/build/outputs/apk/release \
            -maxdepth 1 -type f -name '*unsigned.apk' | head -1)"

          if [ -z "$APK" ]; then
            APK="android/app/build/outputs/apk/release/app-release.apk"
          fi
          test -f "$APK"

          "$BT/zipalign" -f -p 4 \
            "$APK" "$RUNNER_TEMP/trendify-aligned.apk"

          "$BT/apksigner" sign \
            --ks "$RUNNER_TEMP/trendify-release.jks" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:STORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out "$RUNNER_TEMP/Trendify-release.apk" \
            "$RUNNER_TEMP/trendify-aligned.apk"

          "$BT/apksigner" verify --verbose \
            "$RUNNER_TEMP/Trendify-release.apk"

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: Trendify-release
          path: ${{ runner.temp }}/Trendify-release.apk
          if-no-files-found: error

      - name: Clean up temporary signing files
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/trendify-release.jks"
          rm -f "$RUNNER_TEMP/trendify-aligned.apk"
          rm -f "$RUNNER_TEMP/Trendify-release.apk"
